<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qurilish Xizmatlari</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Qurilish Xizmatlari</h1>
        
        <div class="services-grid">
            <!-- Oboy -->
            <div class="card">
                <h3>Oboy yopishtirish</h3>
                <p class="price">1 kv.m — 15 000 so'm</p>
                <div class="input-group">
                    <input type="number" id="sqm-oboy" placeholder="Necha kv.m?" min="1">
                    <button onclick="calculate('Oboy yopishtirish', 15000, 'sqm-oboy')">Hisoblash</button>
                </div>
            </div>

            <!-- Plitka -->
            <div class="card">
                <h3>Plitka terish</h3>
                <p class="price">1 kv.m — 50 000 so'm</p>
                <div class="input-group">
                    <input type="number" id="sqm-plitka" placeholder="Necha kv.m?" min="1">
                    <button onclick="calculate('Plitka terish', 50000, 'sqm-plitka')">Hisoblash</button>
                </div>
            </div>

            <!-- Shpaklyovka -->
            <div class="card">
                <h3>Shpaklyovka qilish</h3>
                <p class="price">1 kv.m — 20 000 so'm</p>
                <div class="input-group">
                    <input type="number" id="sqm-shpak" placeholder="Necha kv.m?" min="1">
                    <button onclick="calculate('Shpaklyovka qilish', 20000, 'sqm-shpak')">Hisoblash</button>
                </div>
            </div>

            <!-- Malyarka / Bo'yoq -->
            <div class="card">
                <h3>Bo'yoq berish (Malyarka)</h3>
                <p class="price">1 kv.m — 18 000 so'm</p>
                <div class="input-group">
                    <input type="number" id="sqm-boyoq" placeholder="Necha kv.m?" min="1">
                    <button onclick="calculate('Bo\'yoq berish', 18000, 'sqm-boyoq')">Hisoblash</button>
                </div>
            </div>
        </div>

        <!-- Natija va Yuborish oynasi -->
        <div id="result-box" class="result-box hidden">
            <h3 id="res-title"></h3>
            <p id="res-details"></p>
            <button id="send-btn" class="send-btn">Buyurtmani yuborish</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
